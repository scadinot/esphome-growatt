# =============================================================================
# Onduleur 1 - LIBELLES TEXTE ET CAPTEURS D'ALARME
# =============================================================================
# PAQUET inclus par growatt.yaml. Ne se compile pas seul.
#
# Ces entites traduisent en clair les codes bruts lus par gw-ond1-mesures,
# lesquels sont en internal: true pour ne pas afficher un entier dans HA.
#
# Les libelles RTC sont dans packages/gw-horloges.yaml.
#
# =============================================================================
# DEFAUTS ET AVERTISSEMENTS - DECODAGE EN ATTENTE D'UN PREMIER EVENEMENT
# ---------------------------------------------------------------------------
# Rien n'a jamais ete different de zero sur ces registres depuis le 13/08 :
# le decodage n'a jamais ete exerce. Et deux sources se contredisent :
#
#   le document Growatt du depot (SPF5000, 2017) :
#     input 40 = "fault bit", 41 = "warning bit" ....... CHAMPS DE BITS
#     input 42 = "fault value", 43 = "warning value" ... NUMEROS
#   la configuration d'origine, d'apres le manuel de l'ES Plus :
#     40 et 41 = numeros LCD, 42 = masque BMS, 43 ignore
#
# Plutot que parier, les quatre registres sont lus (meme trame qu'avant, 43
# ne coute rien) et les libelles ESSAIENT LES DEUX LECTURES :
#   - la table LCD du manuel sur le numero (40, puis 42 ; 41, puis 43)
#   - la table de bits du document sur le champ (40 ; 41)
# et AFFICHENT TOUJOURS LES VALEURS BRUTES entre crochets. Le premier defaut
# reel dira quel registre porte quoi, et on figera le decodage a ce
# moment-la. En attendant, un evenement ne peut plus se perdre dans un
# "Unknown 512" muet.
#
# Les capteurs "Active" s'allument si l'un ou l'autre registre est non nul.
# Les cinq capteurs [BMS] sur les bits de 42 sont conserves tels quels.
# =============================================================================

text_sensor:

  # ---------------------------------------------------------------------------
  # Numero de serie - chaine ASCII dans les holding registers 23-27.
  # C'est la SEULE facon de savoir quelle unite physique porte quelle adresse.
  #
  # force_new_range EST OBLIGATOIRE ICI - voir le piege skip_updates decrit
  # dans growatt.yaml. Sans lui, le skip_updates contamine toute la plage
  # fusionnee et affame les selects et numbers voisins.
  # ---------------------------------------------------------------------------
  - platform: modbus_controller
    modbus_controller_id: growatt
    name: "${upper_devicename} Serial Number Ond1"
    id: serial_number
    register_type: holding
    address: 23
    register_count: 5
    response_size: 10
    raw_encode: ANSI
    skip_updates: 60
    force_new_range: true
    icon: mdi:identifier
    entity_category: diagnostic

  - platform: template
    name: "${upper_devicename} System Status Text Ond1"
    id: system_status_text
    lambda: |-
      int status = (int) id(system_status).state;
      switch (status) {
        case 0: return {"Standby"};
        case 1: return {"No Use"};
        case 2: return {"Discharge"};
        case 3: return {"Fault"};
        case 4: return {"Flash"};
        case 5: return {"PV Charge"};
        case 6: return {"AC Charge"};
        case 7: return {"Combine Charge"};
        case 8: return {"Combine Charge & Bypass"};
        case 9: return {"PV Charge & Bypass"};
        case 10: return {"AC Charge & Bypass"};
        case 11: return {"Bypass"};
        case 12: return {"PV Charge & Discharge"};
        default: return {"Unknown"};
      }
    update_interval: 30s

  - platform: template
    name: "${upper_devicename} Fault Text Ond1"
    lambda: |-
      int c40 = (int) id(fault_code).state;
      int c42 = (int) id(warning_code_high).state;
      if (c40 == 0 && c42 == 0) return {"OK"};
      // Table LCD du manuel : les numeros affiches a l'ecran de l'onduleur.
      static const struct { int c; const char *s; } LCD[] = {
        {1, "Fan fault"}, {2, "Over temperature"}, {3, "Battery over-charged"},
        {5, "Output short circuit"}, {6, "Output voltage too high"},
        {7, "Overload timeout"}, {8, "Bus voltage too high"},
        {9, "Bus soft start failed"}, {51, "Over current / surge"},
        {52, "Bus voltage too low"}, {53, "Inverter soft start failed"},
        {55, "Over DC in AC output"}, {56, "Battery connection open"},
        {57, "Current sensor failed"}, {58, "Output voltage too low"},
        {60, "Negative power fault"}, {61, "PV voltage too high"},
        {62, "Internal comm error"}, {80, "CAN fault"}, {81, "Host loss"}};
      // Champ de bits du document Growatt (table &*8), 16 bits bas.
      static const struct { int m; const char *s; } BITS[] = {
        {0x0002, "CPU A-B comm error"}, {0x0004, "Battery sample inconsistent"},
        {0x0008, "Buck over current"}, {0x0010, "BMS communication fault"},
        {0x0020, "Battery abnormal"}, {0x0080, "Battery voltage high"},
        {0x0100, "Over temperature"}, {0x0200, "Over load"}};
      std::string s;
      for (auto &e : LCD) if (e.c == c40) s = std::string("LCD ") + e.s;
      if (s.empty()) for (auto &e : LCD) if (e.c == c42) s = std::string("LCD ") + e.s;
      std::string b;
      for (auto &e : BITS) if (c40 & e.m) { if (!b.empty()) b += ", "; b += e.s; }
      if (!b.empty()) s += (s.empty() ? "bits " : " | bits ") + b;
      if (s.empty()) s = "Inconnu";
      char raw[40];
      snprintf(raw, sizeof(raw), " [40=%d 42=%d]", c40, c42);
      return {s + raw};
    update_interval: 30s

  - platform: template
    name: "${upper_devicename} Warning Text Ond1"
    lambda: |-
      int c41 = (int) id(warning_code).state;
      int c43 = (int) id(warning_value).state;
      if (c41 == 0 && c43 == 0) return {"OK"};
      // Table LCD du manuel.
      static const struct { int c; const char *s; } LCD[] = {
        {1, "Fan locked"}, {2, "Over temperature"}, {3, "Battery over-charged"},
        {4, "Low battery"}, {7, "Overload"}, {10, "Output power derating"},
        {12, "Solar stop - low battery"}, {13, "Solar stop - high PV voltage"},
        {14, "Solar stop - overload"}, {15, "Parallel input grid different"},
        {16, "Parallel input phase error"}, {17, "Parallel output phase loss"},
        {18, "Buck over current"}, {19, "Battery disconnect"},
        {20, "BMS communication error"}, {21, "PV power insufficient"},
        {22, "Parallel forbidden no battery"}, {25, "Parallel capacity mismatch"},
        {33, "BMS communication loss"}, {34, "Cell over voltage"},
        {35, "Cell under voltage"}, {36, "Total over voltage"},
        {37, "Total under voltage"}, {38, "Discharge over current"},
        {39, "Charge over current"}, {40, "Discharge over temperature"},
        {41, "Charge over temperature"}, {42, "Mosfet over temperature"},
        {43, "Battery over temperature"}, {44, "Battery under temperature"},
        {45, "System shutdown"}};
      // Champ de bits du document Growatt (table &*8).
      static const struct { int m; const char *s; } BITS[] = {
        {0x0001, "Battery voltage low"}, {0x0002, "Over temperature"},
        {0x0004, "Over load"}, {0x0008, "EEPROM read fail"},
        {0x0010, "Firmware version unmatch"}, {0x0020, "EEPROM write fail"},
        {0x0040, "BMS warning"}, {0x0080, "Li-battery over load"},
        {0x0100, "Li-battery aging"}, {0x0200, "Fan lock"}};
      std::string s;
      for (auto &e : LCD) if (e.c == c41) s = std::string("LCD ") + e.s;
      if (s.empty()) for (auto &e : LCD) if (e.c == c43) s = std::string("LCD ") + e.s;
      std::string b;
      for (auto &e : BITS) if (c41 & e.m) { if (!b.empty()) b += ", "; b += e.s; }
      if (!b.empty()) s += (s.empty() ? "bits " : " | bits ") + b;
      if (s.empty()) s = "Inconnu";
      char raw[40];
      snprintf(raw, sizeof(raw), " [41=%d 43=%d]", c41, c43);
      return {s + raw};
    update_interval: 30s

binary_sensor:

  # L'un OU l'autre registre non nul : quel que soit celui qui porte le code.
  - platform: template
    name: "${upper_devicename} Fault Active Ond1"
    lambda: return id(fault_code).state > 0 || id(warning_code_high).state > 0;
    device_class: problem

  - platform: template
    name: "${upper_devicename} Warning Active Ond1"
    lambda: return id(warning_code).state > 0 || id(warning_value).state > 0;
    device_class: problem

  # Numeros LCD 20 et 33 sur 41 ou 43. Le bit 0x0010 de 40 ("BMS
  # communication fault" du document) n'est PAS teste ici : sur un numero
  # LCD, 0x0010 est vrai pour 16-31, 48-63... - faux positifs garantis.
  - platform: template
    name: "${upper_devicename} [BMS] Communication Error Ond1"
    lambda: |-
      int a = (int) id(warning_code).state, b = (int) id(warning_value).state;
      return a == 20 || a == 33 || b == 20 || b == 33;
    device_class: problem

  # Bit 0x0020 : BmsCell OverVolt - surtension cellule individuelle
  - platform: template
    name: "${upper_devicename} [BMS] Cell Over Voltage Ond1"
    lambda: return (((int) id(warning_code_high).state) & 0x0020) != 0;
    device_class: problem

  # Bit 0x0040 : BmsTotalOverVolt - surtension pack total
  - platform: template
    name: "${upper_devicename} [BMS] Pack Over Voltage Ond1"
    lambda: return (((int) id(warning_code_high).state) & 0x0040) != 0;
    device_class: problem

  # Bit 0x0080 : BmsDischgOverCurr - surintensite decharge
  - platform: template
    name: "${upper_devicename} [BMS] Discharge Over Current Ond1"
    lambda: return (((int) id(warning_code_high).state) & 0x0080) != 0;
    device_class: problem

  # Bit 0x0100 : BmsChgOverCurr - surintensite charge
  - platform: template
    name: "${upper_devicename} [BMS] Charge Over Current Ond1"
    lambda: return (((int) id(warning_code_high).state) & 0x0100) != 0;
    device_class: problem

  # Bit 0x0200 : BmsOverTemp - surchauffe BMS
  - platform: template
    name: "${upper_devicename} [BMS] Over Temperature Ond1"
    lambda: return (((int) id(warning_code_high).state) & 0x0200) != 0;
    device_class: heat

  - platform: template
    name: "${upper_devicename} [BMS] Battery Over Charged Ond1"
    lambda: return id(battery_over_charge).state == 1;
    device_class: problem

  - platform: template
    name: "${upper_devicename} Charging Ond1"
    lambda: |-
      int status = (int) id(system_status).state;
      return (status == 5 || status == 6 || status == 7 || status == 8 || status == 9 || status == 10);
    device_class: battery_charging

  - platform: template
    name: "${upper_devicename} Discharging Ond1"
    lambda: |-
      int status = (int) id(system_status).state;
      return (status == 2 || status == 12);

  - platform: template
    name: "${upper_devicename} Grid Available Ond1"
    lambda: return id(grid_voltage).state > 180;
    device_class: power
