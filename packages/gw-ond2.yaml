# =============================================================================
# Onduleur 2 - serie UYN8G3V04A, adresse Modbus 0x02
# =============================================================================
# PAQUET inclus par growatt.yaml. Ne se compile pas seul.
#
# LE n2 N'EXPOSE QUE DES MESURES. Aucune entite pilotable ici : tous les
#   reglages passent par l'onduleur 1, qui les propage - voir
#   packages/gw-ond1-reglages.yaml et packages/gw-seuils-soc.yaml.
#   Seul AC1 ne se propage pas ; il est recopie par automatisation, et sa
#   valeur cote n2 est affichee plus bas EN LECTURE SEULE.
#
# OMIS car identiques au n1 : tension et SOC batterie (memes BMS), tension et
#   frequence reseau (meme reseau).
#
# Son horloge est dans gw-horloges.yaml, ses entites PV dans gw-pv-off.yaml.
#
# PREFIXE [BMS] : trompeur ici comme sur le n1, ce sont des registres de
#   l'onduleur (60-63, 73, 77), et NEGATIF = CHARGE. Explication complete en
#   tete de gw-ond1-mesures.yaml. Les vraies donnees CAN : gw-bms-can.yaml.
#
# Work Time Total Ond2 RETIRE le 13/09/2026 : 0,0 h depuis le 13/08, registre
#   non implemente sur l'ES Plus, une trame par cycle pour rien.
# Defauts et avertissements : quatre registres 40-43 et libelles a double
#   lecture depuis le 13/09/2026, meme logique que le n1 - encadre en tete de
#   gw-ond1-libelles.yaml.
# =============================================================================

sensor:

  # Restitue par "System Status Text Ond2"
  - platform: modbus_controller
    modbus_controller_id: growatt2
    name: "${upper_devicename} System Status Ond2"
    id: system_status_2
    internal: true
    register_type: read
    address: 0
    value_type: U_WORD
    accuracy_decimals: 0

  - platform: modbus_controller
    modbus_controller_id: growatt2
    name: "${upper_devicename} Output Power Ond2"
    register_type: read
    address: 9
    value_type: U_DWORD
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: growatt2
    name: "${upper_devicename} AC Charge Power Ond2"
    register_type: read
    address: 13
    value_type: U_DWORD
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: growatt2
    name: "${upper_devicename} Output Voltage Ond2"
    register_type: read
    address: 22
    value_type: U_WORD
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: growatt2
    name: "${upper_devicename} Output Frequency Ond2"
    register_type: read
    address: 23
    value_type: U_WORD
    unit_of_measurement: "Hz"
    device_class: frequency
    state_class: measurement
    accuracy_decimals: 2
    filters:
      - multiply: 0.01

  - platform: modbus_controller
    modbus_controller_id: growatt2
    name: "${upper_devicename} Inverter Temperature Ond2"
    register_type: read
    address: 25
    value_type: U_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: growatt2
    name: "${upper_devicename} DC-DC Temperature Ond2"
    register_type: read
    address: 26
    value_type: U_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: growatt2
    name: "${upper_devicename} Load Percent Ond2"
    register_type: read
    address: 27
    value_type: U_WORD
    unit_of_measurement: "%"
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: growatt2
    name: "${upper_devicename} Output Current Ond2"
    register_type: read
    address: 34
    value_type: U_WORD
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: growatt2
    name: "${upper_devicename} Inverter Current Ond2"
    register_type: read
    address: 35
    value_type: U_WORD
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: growatt2
    name: "${upper_devicename} AC Input Power Ond2"
    register_type: read
    address: 36
    value_type: U_DWORD
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: growatt2
    name: "${upper_devicename} Fault Code Ond2"
    id: fault_code_2
    internal: true
    register_type: read
    address: 40
    value_type: U_WORD
    accuracy_decimals: 0

  - platform: modbus_controller
    modbus_controller_id: growatt2
    name: "${upper_devicename} Warning Code Ond2"
    id: warning_code_2
    internal: true
    register_type: read
    address: 41
    value_type: U_WORD
    accuracy_decimals: 0

  # 42 et 43 ajoutes le 13/09/2026, meme trame : voir l'encadre "DEFAUTS ET
  # AVERTISSEMENTS" de gw-ond1-libelles.yaml.
  - platform: modbus_controller
    modbus_controller_id: growatt2
    name: "${upper_devicename} BMS Warning Bitmask High Ond2"
    id: warning_code_high_2
    internal: true
    register_type: read
    address: 42
    value_type: U_WORD
    accuracy_decimals: 0

  - platform: modbus_controller
    modbus_controller_id: growatt2
    name: "${upper_devicename} Warning Value Ond2"
    id: warning_value_2
    internal: true
    register_type: read
    address: 43
    value_type: U_WORD
    accuracy_decimals: 0

  - platform: modbus_controller
    modbus_controller_id: growatt2
    name: "${upper_devicename} AC Charge Energy Today Ond2"
    register_type: read
    address: 56
    value_type: U_DWORD
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: growatt2
    name: "${upper_devicename} AC Charge Energy Total Ond2"
    register_type: read
    address: 58
    value_type: U_DWORD
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: growatt2
    name: "${upper_devicename} [BMS] Battery Discharge Today Ond2"
    register_type: read
    address: 60
    value_type: U_DWORD
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: growatt2
    name: "${upper_devicename} [BMS] Battery Discharge Total Ond2"
    register_type: read
    address: 62
    value_type: U_DWORD
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: growatt2
    name: "${upper_devicename} AC Output Energy Today Ond2"
    register_type: read
    address: 64
    value_type: U_DWORD
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: growatt2
    name: "${upper_devicename} AC Output Energy Total Ond2"
    register_type: read
    address: 66
    value_type: U_DWORD
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: growatt2
    name: "${upper_devicename} AC Charge Current Ond2"
    register_type: read
    address: 68
    value_type: U_WORD
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  # S_DWORD : ce registre passe en negatif, cf. l'onduleur 1.
  - platform: modbus_controller
    modbus_controller_id: growatt2
    name: "${upper_devicename} AC Discharge Power Ond2"
    register_type: read
    address: 69
    value_type: S_DWORD
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: growatt2
    name: "${upper_devicename} [BMS] Battery Discharge Power Ond2"
    register_type: read
    address: 73
    value_type: U_DWORD
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: growatt2
    name: "${upper_devicename} [BMS] Battery Power Ond2"
    register_type: read
    address: 77
    value_type: S_DWORD
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: growatt2
    name: "${upper_devicename} Inverter Fan Speed Ond2"
    register_type: read
    address: 82
    value_type: U_WORD
    unit_of_measurement: "%"
    state_class: measurement
    accuracy_decimals: 0

  # ---------------------------------------------------------------------------
  # AC1 cote onduleur 2 - HOLDING 38, EN LECTURE SEULE (24/08/2026)
  #
  # C'etait un number, donc un curseur. Mauvaise idee : la valeur y est
  #   imposee par l'onduleur 1 et toute saisie manuelle etait ecrasee au cycle
  #   suivant. Un curseur qui n'obeit pas est une invitation a l'erreur.
  #
  # Ce capteur reste expose parce qu'il affiche ce que l'onduleur 2 renvoie
  #   REELLEMENT : c'est la preuve que la recopie a abouti, et pas seulement
  #   qu'elle est partie. Pour REGLER le courant, utiliser l'entite Ond1.
  #
  # IL APPARAIT DANS LA CARTE DIAGNOSTIC, pas Configuration, donc pas a cote
  #   de son jumeau Ond1. C'est une contrainte d'ESPHome, essayee et refusee
  #   le 24/08/2026 : "entity_category: config" n'est autorise que sur les
  #   entites pilotables, un sensor ne peut prendre que diagnostic ou rien.
  #   Le seul moyen de le placer dans Configuration serait d'en refaire un
  #   number - donc de le rendre modifiable, ce qu'on ne veut pas.
  #   Pour les voir cote a cote : les poser explicitement sur une carte du
  #   tableau de bord.
  #
  # ATTENTION : c'est un HOLDING register, a ne pas confondre avec
  #   "AC Charge Current Ond2" plus haut, qui est l'INPUT 68 - le courant
  #   reellement mesure, pas la consigne.
  #
  # force_new_range ICI, et non sur ses voisins (13/09/2026) : H37 et H39
  #   sont des capteurs de comparaison en skip_updates: 20, regroupes depuis
  #   ce jour sans force_new_range. Sans cette ligne, H38 prolongerait la
  #   plage H34-H37, en heriterait le skip, et la recopie AC1 ne serait
  #   verifiee que toutes les 10 minutes. Explication en tete de
  #   gw-comparaison.yaml.
  # ---------------------------------------------------------------------------
  - platform: modbus_controller
    modbus_controller_id: growatt2
    name: "${upper_devicename} AC Charge Current Setting (AC1) Ond2"
    id: ac1_reglage_ond2
    register_type: holding
    address: 38
    value_type: U_WORD
    force_new_range: true
    unit_of_measurement: "A"
    device_class: current
    accuracy_decimals: 0
    icon: mdi:transmission-tower-export
    entity_category: diagnostic

text_sensor:

  # force_new_range OBLIGATOIRE avec skip_updates - voir growatt.yaml.
  - platform: modbus_controller
    modbus_controller_id: growatt2
    name: "${upper_devicename} Serial Number Ond2"
    register_type: holding
    address: 23
    register_count: 5
    response_size: 10
    raw_encode: ANSI
    skip_updates: 60
    force_new_range: true
    icon: mdi:identifier
    entity_category: diagnostic

  - platform: template
    name: "${upper_devicename} System Status Text Ond2"
    lambda: |-
      int status = (int) id(system_status_2).state;
      switch (status) {
        case 0: return {"Standby"};
        case 1: return {"No Use"};
        case 2: return {"Discharge"};
        case 3: return {"Fault"};
        case 4: return {"Flash"};
        case 5: return {"PV Charge"};
        case 6: return {"AC Charge"};
        case 7: return {"Combine Charge"};
        case 8: return {"Combine Charge & Bypass"};
        case 9: return {"PV Charge & Bypass"};
        case 10: return {"AC Charge & Bypass"};
        case 11: return {"Bypass"};
        case 12: return {"PV Charge & Discharge"};
        default: return {"Unknown"};
      }
    update_interval: 30s

  - platform: template
    name: "${upper_devicename} Fault Text Ond2"
    lambda: |-
      int c40 = (int) id(fault_code_2).state;
      int c42 = (int) id(warning_code_high_2).state;
      if (c40 == 0 && c42 == 0) return {"OK"};
      // Table LCD du manuel : les numeros affiches a l'ecran de l'onduleur.
      static const struct { int c; const char *s; } LCD[] = {
        {1, "Fan fault"}, {2, "Over temperature"}, {3, "Battery over-charged"},
        {5, "Output short circuit"}, {6, "Output voltage too high"},
        {7, "Overload timeout"}, {8, "Bus voltage too high"},
        {9, "Bus soft start failed"}, {51, "Over current / surge"},
        {52, "Bus voltage too low"}, {53, "Inverter soft start failed"},
        {55, "Over DC in AC output"}, {56, "Battery connection open"},
        {57, "Current sensor failed"}, {58, "Output voltage too low"},
        {60, "Negative power fault"}, {61, "PV voltage too high"},
        {62, "Internal comm error"}, {80, "CAN fault"}, {81, "Host loss"}};
      // Champ de bits du document Growatt (table &*8), 16 bits bas.
      static const struct { int m; const char *s; } BITS[] = {
        {0x0002, "CPU A-B comm error"}, {0x0004, "Battery sample inconsistent"},
        {0x0008, "Buck over current"}, {0x0010, "BMS communication fault"},
        {0x0020, "Battery abnormal"}, {0x0080, "Battery voltage high"},
        {0x0100, "Over temperature"}, {0x0200, "Over load"}};
      std::string s;
      for (auto &e : LCD) if (e.c == c40) s = std::string("LCD ") + e.s;
      if (s.empty()) for (auto &e : LCD) if (e.c == c42) s = std::string("LCD ") + e.s;
      std::string b;
      for (auto &e : BITS) if (c40 & e.m) { if (!b.empty()) b += ", "; b += e.s; }
      if (!b.empty()) s += (s.empty() ? "bits " : " | bits ") + b;
      if (s.empty()) s = "Inconnu";
      char raw[40];
      snprintf(raw, sizeof(raw), " [40=%d 42=%d]", c40, c42);
      return {s + raw};
    update_interval: 30s

  - platform: template
    name: "${upper_devicename} Warning Text Ond2"
    lambda: |-
      int c41 = (int) id(warning_code_2).state;
      int c43 = (int) id(warning_value_2).state;
      if (c41 == 0 && c43 == 0) return {"OK"};
      // Table LCD du manuel.
      static const struct { int c; const char *s; } LCD[] = {
        {1, "Fan locked"}, {2, "Over temperature"}, {3, "Battery over-charged"},
        {4, "Low battery"}, {7, "Overload"}, {10, "Output power derating"},
        {12, "Solar stop - low battery"}, {13, "Solar stop - high PV voltage"},
        {14, "Solar stop - overload"}, {15, "Parallel input grid different"},
        {16, "Parallel input phase error"}, {17, "Parallel output phase loss"},
        {18, "Buck over current"}, {19, "Battery disconnect"},
        {20, "BMS communication error"}, {21, "PV power insufficient"},
        {22, "Parallel forbidden no battery"}, {25, "Parallel capacity mismatch"},
        {33, "BMS communication loss"}, {34, "Cell over voltage"},
        {35, "Cell under voltage"}, {36, "Total over voltage"},
        {37, "Total under voltage"}, {38, "Discharge over current"},
        {39, "Charge over current"}, {40, "Discharge over temperature"},
        {41, "Charge over temperature"}, {42, "Mosfet over temperature"},
        {43, "Battery over temperature"}, {44, "Battery under temperature"},
        {45, "System shutdown"}};
      // Champ de bits du document Growatt (table &*8).
      static const struct { int m; const char *s; } BITS[] = {
        {0x0001, "Battery voltage low"}, {0x0002, "Over temperature"},
        {0x0004, "Over load"}, {0x0008, "EEPROM read fail"},
        {0x0010, "Firmware version unmatch"}, {0x0020, "EEPROM write fail"},
        {0x0040, "BMS warning"}, {0x0080, "Li-battery over load"},
        {0x0100, "Li-battery aging"}, {0x0200, "Fan lock"}};
      std::string s;
      for (auto &e : LCD) if (e.c == c41) s = std::string("LCD ") + e.s;
      if (s.empty()) for (auto &e : LCD) if (e.c == c43) s = std::string("LCD ") + e.s;
      std::string b;
      for (auto &e : BITS) if (c41 & e.m) { if (!b.empty()) b += ", "; b += e.s; }
      if (!b.empty()) s += (s.empty() ? "bits " : " | bits ") + b;
      if (s.empty()) s = "Inconnu";
      char raw[40];
      snprintf(raw, sizeof(raw), " [41=%d 43=%d]", c41, c43);
      return {s + raw};
    update_interval: 30s

binary_sensor:

  - platform: template
    name: "${upper_devicename} Fault Active Ond2"
    lambda: return id(fault_code_2).state > 0 || id(warning_code_high_2).state > 0;
    device_class: problem

  - platform: template
    name: "${upper_devicename} Warning Active Ond2"
    lambda: return id(warning_code_2).state > 0 || id(warning_value_2).state > 0;
    device_class: problem

  - platform: template
    name: "${upper_devicename} Charging Ond2"
    lambda: |-
      int status = (int) id(system_status_2).state;
      return (status == 5 || status == 6 || status == 7 || status == 8 || status == 9 || status == 10);
    device_class: battery_charging

  - platform: template
    name: "${upper_devicename} Discharging Ond2"
    lambda: |-
      int status = (int) id(system_status_2).state;
      return (status == 2 || status == 12);
