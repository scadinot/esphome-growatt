# =============================================================================
# COMPARAISON DES REGLAGES - COMPLEMENT
# =============================================================================
# PAQUET inclus par growatt.yaml. Ne se compile pas seul.
# Suite de gw-comparaison.yaml : les registres de la cartographie qui n'y
# figuraient pas encore. Ensemble, les deux fichiers couvrent TOUT ce que
# l'en-tete de growatt.yaml documente.
#
# ENTITES ET BALAYAGE, les deux
#   Ces entites sont le SUIVI PERMANENT des reglages connus, visibles sur le
#   tableau de bord. gw-scan-diff.yaml est le CONTROLE EXHAUSTIF : il a
#   longtemps lu zero cote Ond2 (cause resolue le 13/09/2026, voir son
#   en-tete) et compare aujourd'hui les 99 registres des deux machines -
#   aucun reglage ne differe, verifie le 13/09.
#
# H3-H6 : ORDRE CORRIGE le 12/09/2026. La premiere version l'avait "deduit"
#   des entites number d'Ond1 en les lisant a l'envers : H3 etait libelle
#   Charge Start, H5 Out Start. Le document Growatt (docs/) et les numbers
#   d'Ond1 concordent : H3 UtiOutStart, H4 UtiOutEnd, H5 UtiChargeStart,
#   H6 UtiChargeEnd. Les NOMS sont conserves, ce sont les adresses qui ont
#   ete echangees - aucune entite HA renommee. Invisible jusque-la : les
#   quatre valaient 0 et 23 des deux cotes.
#
# H39, H8, H20 cote Ond1 RETIRES le 12/09/2026 : deja lus par les selects de
#   gw-ond1-reglages.yaml, et ce doublon les privait de toute valeur - voir
#   l'incident n.2 en tete de gw-comparaison.yaml. Ne restent ici que des
#   registres Ond2, plus H94 qu'aucune entite Ond1 ne lit.
#
# force_new_range RETIRE des capteurs Ond2 le 13/09/2026 pour qu'ils se
#   regroupent en plages contigues (H3-H6 avec H1-H2, H18-H20, H94 avec H95)
#   - explication en tete de gw-comparaison.yaml. Il RESTE sur "Seuil
#   coupure basse V Ond1" : cote Ond1, H95 est un number SANS skip_updates
#   et lui serait contigu ; sans force_new_range, H94 l'affamerait. C'est
#   exactement le piege n.1.
# =============================================================================

sensor:

  # === Type de batterie - LE PLUS IMPORTANT DE CE FICHIER ==================
  # Un onduleur en LI et l'autre en USE chargeraient la meme batterie selon
  # deux lois differentes. A verifier en priorite.
  # Cote Ond1 : select "Battery Type Setting Ond1" (gw-ond1-reglages).

  - platform: modbus_controller
    modbus_controller_id: growatt2
    name: "${upper_devicename} Code type batterie brut Ond2"
    id: cmp2_h39
    internal: true
    register_type: holding
    address: 39
    value_type: U_WORD
    accuracy_decimals: 0
    skip_updates: 20
    icon: mdi:battery-unknown
    entity_category: diagnostic

  # === Mode d'entree AC - plage de tension reseau acceptee =================
  # Determine qui accepte ou rejette le reseau. Deux modes differents et les
  # deux onduleurs ne basculeraient pas au meme moment.
  # Cote Ond1 : select "AC Input Mode Setting Ond1".

  - platform: modbus_controller
    modbus_controller_id: growatt2
    name: "${upper_devicename} Code mode entree AC brut Ond2"
    id: cmp2_h8
    internal: true
    register_type: holding
    address: 8
    value_type: U_WORD
    accuracy_decimals: 0
    skip_updates: 20
    entity_category: diagnostic

  # === Seuil de coupure basse en VOLTS - le pendant du Prog 21 =============

  - platform: modbus_controller
    modbus_controller_id: growatt
    name: "${upper_devicename} Seuil coupure basse V Ond1"
    register_type: holding
    address: 94
    value_type: U_WORD
    unit_of_measurement: "V"
    accuracy_decimals: 1
    filters: [multiply: 0.1]
    skip_updates: 20
    force_new_range: true
    entity_category: diagnostic

  - platform: modbus_controller
    modbus_controller_id: growatt2
    name: "${upper_devicename} Seuil coupure basse V Ond2"
    register_type: holding
    address: 94
    value_type: U_WORD
    unit_of_measurement: "V"
    accuracy_decimals: 1
    filters: [multiply: 0.1]
    skip_updates: 20
    entity_category: diagnostic

  # === Comportement en surcharge ===========================================
  # Cote Ond1 : select "Overload Restart Mode Ond1".

  - platform: modbus_controller
    modbus_controller_id: growatt2
    name: "${upper_devicename} Code surcharge brut Ond2"
    id: cmp2_h20
    internal: true
    register_type: holding
    address: 20
    value_type: U_WORD
    accuracy_decimals: 0
    skip_updates: 20
    entity_category: diagnostic

  # === Recopies Ond2 des fenetres horaires et du buzzer ====================
  # Ond1 a deja ses entites number et switch. Ordre du document Growatt :
  # H3 Out Start, H4 Out End, H5 Charge Start, H6 Charge End.

  - platform: modbus_controller
    modbus_controller_id: growatt2
    name: "${upper_devicename} Utility Charge Start Hour Setting Ond2"
    register_type: holding
    address: 5
    value_type: U_WORD
    unit_of_measurement: "h"
    accuracy_decimals: 0
    skip_updates: 20
    entity_category: diagnostic

  - platform: modbus_controller
    modbus_controller_id: growatt2
    name: "${upper_devicename} Utility Charge End Hour Setting Ond2"
    register_type: holding
    address: 6
    value_type: U_WORD
    unit_of_measurement: "h"
    accuracy_decimals: 0
    skip_updates: 20
    entity_category: diagnostic

  - platform: modbus_controller
    modbus_controller_id: growatt2
    name: "${upper_devicename} Utility Out Start Hour Setting Ond2"
    register_type: holding
    address: 3
    value_type: U_WORD
    unit_of_measurement: "h"
    accuracy_decimals: 0
    skip_updates: 20
    entity_category: diagnostic

  - platform: modbus_controller
    modbus_controller_id: growatt2
    name: "${upper_devicename} Utility Out End Hour Setting Ond2"
    register_type: holding
    address: 4
    value_type: U_WORD
    unit_of_measurement: "h"
    accuracy_decimals: 0
    skip_updates: 20
    entity_category: diagnostic

  - platform: modbus_controller
    modbus_controller_id: growatt2
    name: "${upper_devicename} Code buzzer brut Ond2"
    id: cmp2_h22
    internal: true
    register_type: holding
    address: 22
    value_type: U_WORD
    accuracy_decimals: 0
    skip_updates: 20
    icon: mdi:volume-high
    entity_category: diagnostic

text_sensor:

  # ---------------------------------------------------------------------------
  # LIBELLES - 13/09/2026. Les codes bruts ci-dessus sont passes en internal ;
  # ces text_sensors REPRENNENT LEUR NOM, donc leur identifiant HA, et le
  # tableau de bord n'a rien a changer. Les textes sont COPIES des optionsmap
  # des selects Ond1 (gw-ond1-reglages.yaml) pour que les deux colonnes se
  # lisent pareil : si un optionsmap change, changer ici aussi. Un code hors
  # table sort en "Code N" plutot qu'en silence.
  # ---------------------------------------------------------------------------

  - platform: template
    name: "${upper_devicename} Code type batterie Ond2"
    icon: mdi:battery-unknown
    entity_category: diagnostic
    lambda: |-
      if (isnan(id(cmp2_h39).state)) return {};
      int v = (int) id(cmp2_h39).state;
      switch (v) {
        case 0: return {"AGM"};
        case 1: return {"Flooded"};
        case 2: return {"User-Defined"};
        case 3: return {"Lithium (avec BMS)"};
        case 4: return {"User-Defined 2 (Li sans BMS)"};
        default: return {"Code " + to_string(v)};
      }
    update_interval: 60s

  - platform: template
    name: "${upper_devicename} Code mode entree AC Ond2"
    icon: mdi:transmission-tower-import
    entity_category: diagnostic
    lambda: |-
      if (isnan(id(cmp2_h8).state)) return {};
      int v = (int) id(cmp2_h8).state;
      switch (v) {
        case 0: return {"APL (90-280VAC)"};
        case 1: return {"UPS (170-280VAC)"};
        default: return {"Code " + to_string(v)};
      }
    update_interval: 60s

  - platform: template
    name: "${upper_devicename} Code surcharge Ond2"
    icon: mdi:restart-alert
    entity_category: diagnostic
    lambda: |-
      if (isnan(id(cmp2_h20).state)) return {};
      int v = (int) id(cmp2_h20).state;
      switch (v) {
        case 0: return {"Yes (Auto restart)"};
        case 1: return {"No (Stop)"};
        case 2: return {"Switch to Utility"};
        default: return {"Code " + to_string(v)};
      }
    update_interval: 60s

  - platform: template
    name: "${upper_devicename} Code buzzer Ond2"
    icon: mdi:volume-high
    entity_category: diagnostic
    lambda: |-
      if (isnan(id(cmp2_h22).state)) return {};
      int v = (int) id(cmp2_h22).state;
      switch (v) {
        case 0: return {"Inactif"};
        case 1: return {"Actif"};
        default: return {"Code " + to_string(v)};
      }
    update_interval: 60s
