# =============================================================================
# PV ET GENERATEUR - EN ATTENTE DE RACCORDEMENT
# =============================================================================
# PAQUET inclus par growatt.yaml. Ne se compile pas seul.
#
# Ni panneaux ni groupe electrogene ne sont raccordes au 23/08/2026. Tout est
# COMMENTE, rien n'est supprime. Un paquet sans aucune cle est valide.
#
# POUR REACTIVER : retirer le "# " en tete des lignes voulues, en pensant a
# retablir les cles de premier niveau (sensor:, binary_sensor:, number:).
#
# CE QUI EST ICI, pour les DEUX onduleurs :
#   - tensions, puissances et courants PV1/PV2 ......... input 1 a 8
#   - energies PV1/PV2 du jour et totales .............. input 48 a 55
#   - temperatures Buck1 et Buck2 ...................... input 32-33
#   - vitesse du ventilateur MPPT ...................... input 81
#   - PV Total Power et PV Producing ................... calcules
#   - Generator Charge Current (GEN1) .................. holding 83
#
# Buck1 et Buck2 sont les deux etages du chargeur SOLAIRE, d'ou leur presence
#   ici - cf. le libelle d'origine "PV1 Current (Buck1)".
#
# GEN1 ne se propage pas d'un onduleur a l'autre, comme AC1 : la recopie est
#   deja ecrite ci-dessous, onduleur 1 maitre.
#
# RESTE ACTIF ailleurs malgre l'apparence : Charge Priority (CSO/SNU/OSO)
#   gouverne la charge des maintenant - en OSO l'onduleur refuserait le
#   reseau. Et les libelles d'alarme mentionnant le solaire ne sont que des
#   chaines dans un switch/case.
#
# EFFET DE BORD : les plages Modbus correspondantes ne sont pas interrogees,
#   le cycle de scrutation en est raccourci. A resurveiller le jour de la
#   reactivation - voir la note sur "Duplicate modbus command found" dans
#   growatt.yaml.
# =============================================================================

