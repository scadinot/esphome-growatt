# =============================================================================
# COMPARAISON DES REGLAGES ENTRE LES DEUX ONDULEURS
# =============================================================================
# PAQUET inclus par growatt.yaml. Ne se compile pas seul.
# Complete par gw-comparaison-b.yaml (H39, H8, H94, H20, H3-H6, H22).
#
# POURQUOI
#   Audit du 28/08/2026 : 11 reglages pilotables sur Ond1, UN SEUL visible
#   sur Ond2 (le courant AC1). Impossible de verifier que les deux machines
#   etaient configurees pareil - alors qu'elles ont tourne en parallele.
#
# =============================================================================
# NE JAMAIS DUPLIQUER UN REGISTRE DEJA LU AILLEURS - incident du 28/08/2026
# ---------------------------------------------------------------------------
# Ce fichier a d'abord expose H1 et H2 cote Ond1 sous forme de capteurs, avec
# skip_updates et force_new_range. Or Ond1 lisait DEJA ces deux registres via
# ses entites select (Output Priority, Charge Priority), dans
# gw-ond1-reglages.yaml.
#
# CONSEQUENCE : le force_new_range du doublon en H2 a ouvert une plage qui a
# absorbe H3, H4, H5 et H6 - les quatre fenetres horaires d'Ond1, qui n'ont
# pas de skip_updates. Elles ont herite du skip_updates: 20 de la plage et
# ont cesse de remonter. Les quatre entites number sont passees a "Inconnu"
# sur le tableau de bord.
#
# C'est EXACTEMENT le piege n.1 decrit en tete de growatt.yaml, relu et cite
# le jour meme avant d'ecrire ce fichier. skip_updates appartient a la PLAGE,
# pas a l'entite - et force_new_range ne protege que l'item qui le porte, pas
# ses voisins de la plage qu'il vient d'ouvrir.
#
# REGLE A APPLIQUER : avant d'ajouter un registre ici, verifier qu'aucune
# autre entite ne le lit deja. Si Ond1 a deja un number, un select ou un
# switch sur ce registre, le tableau de bord doit pointer VERS CETTE
# ENTITE-LA. On n'ajoute ici que le cote Ond2, ou les registres qu'aucun des
# deux n'expose.
#
# D'ou l'absence de H1 et H2 cote Ond1 dans ce fichier : ils sont lus par
# select.<...>_output_priority_ond1 et select.<...>_charge_priority_ond1.
#
# =============================================================================
# INCIDENT N.2 - 12/09/2026 : LA REGLE CI-DESSUS ETAIT VIOLEE SEPT FOIS
# ---------------------------------------------------------------------------
# Ce fichier et gw-comparaison-b.yaml exposaient encore, cote Ond1, H18, H19,
# H35, H36 (ici) et H8, H20, H39 (complement) - sept registres qu'Ond1 lisait
# DEJA par ses selects et numbers de gw-ond1-reglages.yaml. Ecrits le meme
# jour que la regle, quelques lignes en dessous.
#
# CONSEQUENCE, invisible pendant quinze jours : les selects AC Input Mode,
# Output Voltage, Output Frequency et Overload Restart d'Ond1 N'ONT JAMAIS
# RECU DE VALEUR. Le flux /events de l'ESP les montrait a vide le 12/09,
# alors que Battery Type, Bulk et Float, dupliques eux aussi, avaient la leur.
#
# LE MECANISME, lu dans le code du composant (2026.7.4) : les entites en
# force_new_range sont triees EN TETE et ouvrent chacune leur plage. Les
# selects, parcourus ensuite, forment les leurs : (18,3) et (8,1). A la
# reception, le composant cherche LA PREMIERE plage ayant le meme type et la
# meme adresse de depart - toujours celle du doublon. La reponse au poll des
# selects lui etait livree ; les selects ne recevaient rien. Battery Type,
# Bulk et Float survivaient parce que leur plage demarre en H34, le capteur
# Max Charge Current de gw-ond1-divers.yaml, adresse que personne ne
# dupliquait. De la chance, pas de la conception.
#
# Personne n'a rien vu : les quatre selects sont disabled_by_default.
#
# REGLE, cette fois appliquee : ce fichier et son complement ne contiennent
# QUE des registres Ond2, ou des registres qu'AUCUNE entite Ond1 ne lit
# (H94 est le seul). Pour comparer, le tableau de bord met le select ou le
# number Ond1 en face du capteur Ond2.
# =============================================================================
#
# LA PISTE H18, FERMEE
#   Les deux onduleurs regulent a 232.2 V et 229.9 V une fois decouples.
#   On a d'abord soupconne une consigne differente. VERIFIE : H18 vaut 1 sur
#   les DEUX, et c'est une enumeration (1 = 230 V), pas une tension reglable.
#   L'ecart ne vient donc pas d'un reglage. Reste le firmware DSP.
#
# ECHELLES : H18 et H19 sont lus SANS multiply - ce sont des enumerations.
#   H35, H36, H37, H82, H95 portent le x10 documente dans growatt.yaml.
#
# CADENCE : skip_updates: 20 = relecture toutes les 10 minutes. Assez rapide
#   pour voir l'effet d'une correction faite sur l'ecran de l'onduleur.
#
# =============================================================================
# REGROUPEMENT DES PLAGES - 13/09/2026 : PLUS DE force_new_range ICI
# ---------------------------------------------------------------------------
# Chaque capteur portait force_new_range, "par prudence". Consequence : dix-
# neuf trames d'un registre chacune cote Ond2 (ce fichier et son complement)
# tirees TOUTES dans le meme cycle, toutes les 10 min 30 - le cycle de rafale
# qui, sur 2026.7.4, depassait les 30 s d'intervalle et faisait sortir
# quatorze "Duplicate modbus command found" d'un coup (captures du 12/09).
#
# CE QUE FAIT VRAIMENT force_new_range, lu dans le composant 2026.8.2 : le
#   parcours des capteurs place les force_new_range EN TETE, puis les autres
#   par adresse. Un capteur force_new_range ouvre donc toujours sa propre
#   plage, et jamais un voisin ne peut la rejoindre - "un sur le premier de
#   chaque suite" ne regroupe rien. Pour que H1..H6 partent en UNE trame,
#   aucun des six ne doit le porter : ils se suivent alors dans le parcours
#   ordinaire, chacun prolonge la plage du precedent, et la plage prend le
#   plus petit skip_updates non nul - 20 pour tous.
#
# LE PIEGE N.1 NE MORD PAS ICI parce que tous les voisins contigus ont le
#   MEME skip_updates. Il mord quand une plage melange un capteur a skip et
#   un capteur sans : le sans est affame. Le seul cas cote Ond2 est H38
#   (AC1, sans skip, gw-ond2.yaml) coince entre H37 et H39 : c'est LUI qui
#   porte desormais force_new_range, pour rester seul dans sa plage.
#
# PLAGES OND2 ATTENDUES apres regroupement, skip 20 sauf mention :
#   (1,6) H1-H6 | (8,1) | (18,3) H18-H20 | (22,1) | (34,4) H34-H37 | (39,1)
#   (82,1) | (94,2) H94-H95   soit 8 trames au lieu de 19
#   inchangees : (9,3) et (12,3) firmware skip 200, (23,5) serie skip 60,
#   (38,1) AC1 et (45,6) horloge sans skip.
# =============================================================================

sensor:

  # === H18 - CONSIGNE DE TENSION DE SORTIE =================================
  # Cote Ond1 : select "Output Voltage Setting Ond1" (gw-ond1-reglages).

  - platform: modbus_controller
    modbus_controller_id: growatt2
    name: "${upper_devicename} Consigne tension sortie Ond2"
    register_type: holding
    address: 18
    value_type: U_WORD
    accuracy_decimals: 0
    skip_updates: 20
    icon: mdi:sine-wave
    entity_category: diagnostic

  # === H19 - CONSIGNE DE FREQUENCE =========================================
  # Cote Ond1 : select "Output Frequency Setting Ond1".

  - platform: modbus_controller
    modbus_controller_id: growatt2
    name: "${upper_devicename} Consigne frequence Ond2"
    register_type: holding
    address: 19
    value_type: U_WORD
    accuracy_decimals: 0
    skip_updates: 20
    icon: mdi:sine-wave
    entity_category: diagnostic

  # === H35 / H36 - TENSIONS DE CHARGE (x10) ================================
  # Doivent concorder entre deux onduleurs sur une meme batterie : deux
  # consignes d'absorption differentes, et l'un surcharge pendant que
  # l'autre croit avoir fini.
  # Cote Ond1 : numbers "Bulk / Float Charge Voltage Setting Ond1".

  - platform: modbus_controller
    modbus_controller_id: growatt2
    name: "${upper_devicename} Tension absorption Ond2"
    register_type: holding
    address: 35
    value_type: U_WORD
    unit_of_measurement: "V"
    accuracy_decimals: 1
    filters: [multiply: 0.1]
    skip_updates: 20
    entity_category: diagnostic

  - platform: modbus_controller
    modbus_controller_id: growatt2
    name: "${upper_devicename} Tension floating Ond2"
    register_type: holding
    address: 36
    value_type: U_WORD
    unit_of_measurement: "V"
    accuracy_decimals: 1
    filters: [multiply: 0.1]
    skip_updates: 20
    entity_category: diagnostic

  # === RECOPIES OND2 SEULEMENT =============================================
  # Ond1 a deja ses entites number/select/switch sur ces registres : le
  # tableau de bord pointe vers elles. Rien ici cote Ond1.

  - platform: modbus_controller
    modbus_controller_id: growatt2
    name: "${upper_devicename} Battery Low to Utility SOC Setting Ond2"
    register_type: holding
    address: 37
    value_type: U_WORD
    unit_of_measurement: "%"
    accuracy_decimals: 0
    filters: [multiply: 0.1]
    skip_updates: 20
    entity_category: diagnostic

  - platform: modbus_controller
    modbus_controller_id: growatt2
    name: "${upper_devicename} Utility Back to Battery SOC Setting Ond2"
    register_type: holding
    address: 95
    value_type: U_WORD
    unit_of_measurement: "%"
    accuracy_decimals: 0
    filters: [multiply: 0.1]
    skip_updates: 20
    entity_category: diagnostic

  - platform: modbus_controller
    modbus_controller_id: growatt2
    name: "${upper_devicename} Low DC Cut-off SOC Setting Ond2"
    register_type: holding
    address: 82
    value_type: U_WORD
    unit_of_measurement: "%"
    accuracy_decimals: 0
    filters: [multiply: 0.1]
    skip_updates: 20
    entity_category: diagnostic

  - platform: modbus_controller
    modbus_controller_id: growatt2
    name: "${upper_devicename} Max Charge Current Ond2"
    register_type: holding
    address: 34
    value_type: U_WORD
    unit_of_measurement: "A"
    accuracy_decimals: 0
    skip_updates: 20
    entity_category: diagnostic

  # H1 et H2 cote Ond2 uniquement. Cote Ond1, voir les entites select.
  # Codes bruts, non traduits : on compare deux nombres, ce qui suffit et
  # evite d'inventer une table d'equivalence non verifiee.
  - platform: modbus_controller
    modbus_controller_id: growatt2
    name: "${upper_devicename} Code priorite sortie Ond2"
    register_type: holding
    address: 1
    value_type: U_WORD
    accuracy_decimals: 0
    skip_updates: 20
    entity_category: diagnostic

  - platform: modbus_controller
    modbus_controller_id: growatt2
    name: "${upper_devicename} Code priorite charge Ond2"
    register_type: holding
    address: 2
    value_type: U_WORD
    accuracy_decimals: 0
    skip_updates: 20
    entity_category: diagnostic
