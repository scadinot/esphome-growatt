# =============================================================================
# BALAYAGE COMPARATIF DES DEUX ONDULEURS - H0 a H98
# =============================================================================
# PAQUET inclus par growatt.yaml. Ne se compile pas seul.
#
# POURQUOI
#   La cartographie des holding registers de growatt.yaml a ete etablie PAR
#   ALLER-RETOUR LCD : elle ne contient que ce que quelqu'un a pense a
#   toucher sur l'ecran. Comparer Ond1 et Ond2 a partir de cette carte ne
#   prouve rien sur ce qu'elle ignore. Cet outil lit TOUT.
#
# TROIS LECONS DU 28/08/2026 - toutes le meme piege
#
#   1. UN SILENCE N'EST PAS UN RESULTAT. Premier essai : zero ligne [diff].
#      Tentant de conclure "les deux sont identiques". FAUX - on SAIT que
#      H9-H14 et H23-H27 different. D'ou les COMPTEURS.
#
#   2. NE PAS PUBLIER UN RESULTAT DANS LES LOGS SEULEMENT. Le tampon se
#      ferme avant la fin d'un script de 30 s. D'ou les ENTITES.
#
#   3. LE GARDE-FOU DOIT COUVRIR LES DEUX COTES. Troisieme essai :
#      Ond1 = 100 registres, Ond2 = 0, et l'entite affichait "Aucun ecart".
#      Le repli ne testait que scan_n1. Une comparaison sans second terme
#      n'est pas une comparaison negative, c'est une absence de comparaison.
#      Corrige : les deux compteurs sont testes.
#
# =============================================================================
# POURQUOI OND2 LISAIT ZERO - resolu le 13/09/2026
# ---------------------------------------------------------------------------
# Du 28/08 au 13/09 ce fichier lisait 100/100 cote Ond1 et 0/100 cote Ond2,
# en blocs de 20 comme de 10, et l'en-tete incriminait le firmware d'Ond2.
#
# LE TEST QUI A TRANCHE (gw-scan-ond2.yaml, 13/09/2026 00:37) : neuf
#   lectures sur Ond2, UNE PAR UNE, espacees de 6 s - blocs de 9, 10, 20 et
#   45 mots, un bloc a cheval sur 45, deux blocs de 45 en input. NEUF
#   REPONSES SUR NEUF, tailles exactes, valeurs justes. Ond2 accepte tout,
#   y compris ce que le document interdit.
#
# LA CAUSE ETAIT LA METHODE : les dix blocs etaient EMPILES d'un coup dans
#   la file du controleur, derriere sa scrutation courante. Une lecture
#   sans reponse - une seule - passe le controleur hors ligne apres ses
#   relances et VIDE SA FILE : les neuf autres blocs partaient a la
#   poubelle, sans une ligne de log au niveau WARN. Ond1, interroge en
#   premier et sur une file vide, n'y etait jamais expose. Le mecanisme est
#   dans le composant (set_online(false) -> clear_tx_queue_for_address) ;
#   il ne fait pas de difference entre 2026.7.4 et 2026.8.2.
#
# LA REPONSE : UNE LECTURE A LA FOIS. Trois blocs par onduleur, ALIGNES SUR
#   45 comme le document le demande (0-44, 45-89, 90-98), chacun attendu
#   3 s avant le suivant. Six trames au lieu de vingt, et plus rien
#   d'empile. Le document limite une lecture a 45 mots : 90-98 fait 9.
#
# =============================================================================
# COMMENT S'EN SERVIR
#   Appuyer sur "Scan comparatif Ond1-Ond2", attendre 25 s, puis lire :
#     Scan registres Ond1 ... doit valoir 99
#     Scan registres Ond2 ... doit valoir 99
#     Scan ecarts .......... nombre de registres differents
#     Scan detail .......... la liste, format H<reg>:<Ond1>/<Ond2>
#   LIRE LES DEUX COMPTEURS D'ABORD. Si l'un n'est pas a 99, le reste est
#   nul et non avenu.
#
# TEMOINS DE BON FONCTIONNEMENT
#   H23 a H27 (serie) et H80 (code usine) DOIVENT figurer dans les ecarts.
#   S'ils n'y sont pas, le balayage a echoue, quels que soient les compteurs.
#   H9 a H14 (firmware) n'en sont PLUS : les deux onduleurs sont en
#   100.08 / 101.07 depuis le 29/09/2026, ces registres sont egaux.
#
# ECARTS ATTENDUS, SANS SIGNIFICATION
#   H23-H27 .......... serie, cf. ci-dessus. (H9-H14, firmware, jusqu'au
#                      29/09/2026.)
#   H34 .............. courant de charge max : valeur DYNAMIQUE imposee par
#                      le BMS en mode lithium. A affiche 100, 280 puis 400
#                      cote Ond1 selon les jours, 55 cote Ond2 - et 0 sur
#                      les deux batterie pleine. Ce n'est pas une consigne.
#   H45-H50 .......... horloge, EXCLUE du diff : les deux RTC derivent.
#   H80 .............. "Factory - The ODM Info code" du document : 13201
#                      cote Ond1, 13202 cote Ond2. Un code d'usine, pas un
#                      reglage.
#
# TOUT LE RESTE QUI SORT EST A EXAMINER.
#
# PREMIER BALAYAGE COMPLET - 13/09/2026 a 00:47
#   Ond1 = 99, Ond2 = 99, HUIT ecarts, tous attendus : H11, H14 (firmware),
#   H23 a H27 (serie), H80 (code usine). H34 valait 0 des deux cotes,
#   batterie pleine. AUCUN REGLAGE NE DIFFERE entre les deux onduleurs sur
#   les 99 registres - la reponse que l'audit du 28/08 cherchait, et que
#   les entites de comparaison ne pouvaient donner que sur la carte connue.
#   L'ecart de 2,1 V entre les sorties decouplees n'a donc aucun reglage
#   pour cause : il ne reste que le DSP (101.05 contre 101.07).
#
# BALAYAGES DU 09/11/2026, avant et apres le portage sur modbus_client
#   Ond1 = 99, Ond2 = 99, SEPT ecarts, identiques aux deux passages :
#   H23 a H27 (serie), H34 = 240/100 (dynamique), H80 (code usine).
#
# PORTE SUR ESPHOME 2026.8.2 le 12/09/2026 : handler en std::span,
#   enumeration modbus::EntityType. Reecrit le 13/09/2026 pour la lecture
#   une par une - la structure a compteurs et entites est inchangee.
#
# PORTE SUR modbus_client.read_holding_registers (ModbusCommandItem et
#   queue_command retires en 2027.3.0). Trois consequences :
#   - le gestionnaire on_response ne recoit que `values` (mots deja dans
#     l'ordre de l'hote), PAS l'adresse lue. Chaque lecture porte donc son
#     adresse de debut EN DUR. Une globale "bloc en cours" serait fausse si
#     une reponse arrivait apres le depart de la lecture suivante, la file
#     du hub pouvant etre encombree par la scrutation des controleurs.
#   - Ond2 est range dans scan_ond2 et compare A LA FIN, plus au vol.
#   - une non-reponse ne touche plus l'etat du controleur : elle ne le met
#     plus hors ligne et ne vide plus sa file (cause du zero du 28/08).
#     L'inverse reste vrai : un controleur qui passe hors ligne vide la
#     file de son adresse, la lecture en attente sort en on_not_sent.
#   Chaque echec est journalise en WARN ; les compteurs restent la preuve.
# =============================================================================

globals:
  - id: scan_ond1
    type: uint16_t[100]
    restore_value: no

  - id: scan_ond2
    type: uint16_t[100]
    restore_value: no

  - id: scan_n1
    type: int
    restore_value: no
    initial_value: '0'

  - id: scan_n2
    type: int
    restore_value: no
    initial_value: '0'

  - id: scan_ndiff
    type: int
    restore_value: no
    initial_value: '0'

  - id: scan_txt
    type: std::string
    restore_value: no

script:

  - id: scan_comparatif
    mode: single
    then:
      - lambda: |-
          for (int i = 0; i < 100; i++) {
            id(scan_ond1)[i] = 0xFFFF;
            id(scan_ond2)[i] = 0xFFFF;
          }
          id(scan_n1) = 0;
          id(scan_n2) = 0;
          id(scan_ndiff) = 0;
          id(scan_txt) = "";
          id(scan_detail).publish_state("Scan en cours...");

      # Ond1, trois blocs alignes sur 45, un a la fois, adresse en dur.
      - modbus_client.read_holding_registers:
          modbus_id: modbus_growatt
          address: !lambda 'return id(growatt)->device_address();'
          start_address: 0
          count: 45
          on_response:
            then:
              - lambda: |-
                  for (size_t i = 0; i < values.size() && 0 + i < 100; i++) {
                    id(scan_ond1)[0 + i] = values[i];
                    id(scan_n1)++;
                  }
          on_error:
            then:
              - lambda: 'ESP_LOGW("scan", "Ond1 H0 x45 : exception 0x%02X", (uint8_t) exception_code);'
          on_no_response: !lambda |-
            ESP_LOGW("scan", "Ond1 H0 x45 : pas de reponse");
            return false;
          on_not_sent:
            then:
              - lambda: 'ESP_LOGW("scan", "Ond1 H0 x45 : retiree de la file avant envoi");'
      - delay: 3s
      - modbus_client.read_holding_registers:
          modbus_id: modbus_growatt
          address: !lambda 'return id(growatt)->device_address();'
          start_address: 45
          count: 45
          on_response:
            then:
              - lambda: |-
                  for (size_t i = 0; i < values.size() && 45 + i < 100; i++) {
                    id(scan_ond1)[45 + i] = values[i];
                    id(scan_n1)++;
                  }
          on_error:
            then:
              - lambda: 'ESP_LOGW("scan", "Ond1 H45 x45 : exception 0x%02X", (uint8_t) exception_code);'
          on_no_response: !lambda |-
            ESP_LOGW("scan", "Ond1 H45 x45 : pas de reponse");
            return false;
          on_not_sent:
            then:
              - lambda: 'ESP_LOGW("scan", "Ond1 H45 x45 : retiree de la file avant envoi");'
      - delay: 3s
      - modbus_client.read_holding_registers:
          modbus_id: modbus_growatt
          address: !lambda 'return id(growatt)->device_address();'
          start_address: 90
          count: 9
          on_response:
            then:
              - lambda: |-
                  for (size_t i = 0; i < values.size() && 90 + i < 100; i++) {
                    id(scan_ond1)[90 + i] = values[i];
                    id(scan_n1)++;
                  }
          on_error:
            then:
              - lambda: 'ESP_LOGW("scan", "Ond1 H90 x9 : exception 0x%02X", (uint8_t) exception_code);'
          on_no_response: !lambda |-
            ESP_LOGW("scan", "Ond1 H90 x9 : pas de reponse");
            return false;
          on_not_sent:
            then:
              - lambda: 'ESP_LOGW("scan", "Ond1 H90 x9 : retiree de la file avant envoi");'
      - delay: 3s

      # Ond2, memes blocs.
      - modbus_client.read_holding_registers:
          modbus_id: modbus_growatt
          address: !lambda 'return id(growatt2)->device_address();'
          start_address: 0
          count: 45
          on_response:
            then:
              - lambda: |-
                  for (size_t i = 0; i < values.size() && 0 + i < 100; i++) {
                    id(scan_ond2)[0 + i] = values[i];
                    id(scan_n2)++;
                  }
          on_error:
            then:
              - lambda: 'ESP_LOGW("scan", "Ond2 H0 x45 : exception 0x%02X", (uint8_t) exception_code);'
          on_no_response: !lambda |-
            ESP_LOGW("scan", "Ond2 H0 x45 : pas de reponse");
            return false;
          on_not_sent:
            then:
              - lambda: 'ESP_LOGW("scan", "Ond2 H0 x45 : retiree de la file avant envoi");'
      - delay: 3s
      - modbus_client.read_holding_registers:
          modbus_id: modbus_growatt
          address: !lambda 'return id(growatt2)->device_address();'
          start_address: 45
          count: 45
          on_response:
            then:
              - lambda: |-
                  for (size_t i = 0; i < values.size() && 45 + i < 100; i++) {
                    id(scan_ond2)[45 + i] = values[i];
                    id(scan_n2)++;
                  }
          on_error:
            then:
              - lambda: 'ESP_LOGW("scan", "Ond2 H45 x45 : exception 0x%02X", (uint8_t) exception_code);'
          on_no_response: !lambda |-
            ESP_LOGW("scan", "Ond2 H45 x45 : pas de reponse");
            return false;
          on_not_sent:
            then:
              - lambda: 'ESP_LOGW("scan", "Ond2 H45 x45 : retiree de la file avant envoi");'
      - delay: 3s
      - modbus_client.read_holding_registers:
          modbus_id: modbus_growatt
          address: !lambda 'return id(growatt2)->device_address();'
          start_address: 90
          count: 9
          on_response:
            then:
              - lambda: |-
                  for (size_t i = 0; i < values.size() && 90 + i < 100; i++) {
                    id(scan_ond2)[90 + i] = values[i];
                    id(scan_n2)++;
                  }
          on_error:
            then:
              - lambda: 'ESP_LOGW("scan", "Ond2 H90 x9 : exception 0x%02X", (uint8_t) exception_code);'
          on_no_response: !lambda |-
            ESP_LOGW("scan", "Ond2 H90 x9 : pas de reponse");
            return false;
          on_not_sent:
            then:
              - lambda: 'ESP_LOGW("scan", "Ond2 H90 x9 : retiree de la file avant envoi");'
      - delay: 3s

      # Comparaison, une fois les deux cotes lus. H45-H50 (horloges) exclus.
      # 0xFFFF = mot non lu d'un cote ou de l'autre : pas compare.
      - lambda: |-
          char buf[32];
          for (int reg = 0; reg < 99; reg++) {
            if (reg >= 45 && reg <= 50) continue;
            uint16_t v1 = id(scan_ond1)[reg];
            uint16_t v2 = id(scan_ond2)[reg];
            if (v1 == 0xFFFF || v2 == 0xFFFF) continue;
            if (v1 != v2) {
              id(scan_ndiff)++;
              ESP_LOGW("diff", "H%d : Ond1=%u  Ond2=%u", reg, v1, v2);
              snprintf(buf, sizeof(buf), "H%d:%u/%u ", reg, v1, v2);
              id(scan_txt) += buf;
            }
          }

      - lambda: |-
          id(scan_r1).publish_state(id(scan_n1));
          id(scan_r2).publish_state(id(scan_n2));
          id(scan_rd).publish_state(id(scan_ndiff));

          // Le repli teste LES DEUX compteurs. Une comparaison sans second
          // terme n'est pas un resultat negatif - c'est un echec.
          std::string t;
          if (id(scan_n1) == 0 && id(scan_n2) == 0)
            t = "ECHEC : aucun des deux onduleurs n'a repondu";
          else if (id(scan_n1) == 0)
            t = "ECHEC : Ond1 n'a pas repondu, rien compare";
          else if (id(scan_n2) == 0)
            t = "ECHEC : Ond2 n'a pas repondu, rien compare";
          else if (id(scan_n1) < 99 || id(scan_n2) < 99)
            t = "INCOMPLET : " + to_string(id(scan_n1)) + "/" + to_string(id(scan_n2)) + " registres - " + id(scan_txt);
          else if (id(scan_txt).empty())
            t = "Aucun ecart sur les registres lus des deux cotes";
          else
            t = id(scan_txt);

          if (t.size() > 250) t = t.substr(0, 238) + " ...(voir logs)";
          id(scan_detail).publish_state(t);
          ESP_LOGW("scan", "Bilan : Ond1=%d Ond2=%d registres, %d ecarts",
                   id(scan_n1), id(scan_n2), id(scan_ndiff));

sensor:
  - platform: template
    name: "${upper_devicename} Scan registres Ond1"
    id: scan_r1
    accuracy_decimals: 0
    icon: mdi:counter
    entity_category: diagnostic
    update_interval: never

  - platform: template
    name: "${upper_devicename} Scan registres Ond2"
    id: scan_r2
    accuracy_decimals: 0
    icon: mdi:counter
    entity_category: diagnostic
    update_interval: never

  - platform: template
    name: "${upper_devicename} Scan ecarts"
    id: scan_rd
    accuracy_decimals: 0
    icon: mdi:not-equal-variant
    entity_category: diagnostic
    update_interval: never

text_sensor:
  - platform: template
    name: "${upper_devicename} Scan detail"
    id: scan_detail
    icon: mdi:format-list-numbered
    entity_category: diagnostic
    update_interval: never

button:
  - platform: template
    name: "${upper_devicename} Scan comparatif Ond1-Ond2"
    icon: mdi:compare-horizontal
    entity_category: diagnostic
    on_press:
      - script.execute: scan_comparatif
