# =============================================================================
# BALAYAGE DES INPUT REGISTERS D'OND1 - a la recherche des donnees BMS
# =============================================================================
# PAQUET inclus par growatt.yaml. Ne se compile pas seul. OUTIL PONCTUEL.
#
# POURQUOI (12/09/2026)
#   Le document Growatt du depot (SPF5000, V0.11, 2017) place les donnees
#   recues du BMS par le CAN en input 90-117. Lus sur le SPF 6000 ES Plus le
#   12/09/2026 (gw-bms-can.yaml) : SOC 0, tension 0, courant 0, et des
#   valeurs residuelles (1, 2) sans sens - pas d'exception Modbus, mais pas
#   de BMS non plus. L'ES Plus range ces donnees ailleurs, ou nulle part.
#
# CE QUE L'ON CHERCHE, en clair, dans les valeurs brutes :
#   le SOC (98 ce soir), la tension pack (538x en 0,01 V ou 538 en 0,1 V),
#   les cellules (3342 a 3352 en mV), la limite de charge du BMS.
#   Toute suite de seize valeurs voisines de 3350 est la signature des
#   cellules et fixe le debut du bloc.
#
# COMMENT
#   Bouton "Scan input Ond1" : 136 blocs de 9 registres, UNE LECTURE A LA
#   FOIS. Chaque bloc contenant au moins une valeur non nulle sort une ligne
#   WARN "scanin" avec ses registres non nuls ; les blocs a zero sont
#   muets ; un registre inexistant sort en "Ixxx x9 : exception 0x02". Lire
#   dans le flux /events de l'ESP (curl -sN http://ip/events) ou dans les
#   logs du tableau de bord ESPHome. Duree : une a deux minutes, selon la
#   place laissee par la scrutation des controleurs.
#
# PORTE SUR modbus_client.read_input_registers le 09/11/2026
#   (ModbusCommandItem et queue_command retires en 2027.3.0). Avant, chaque
#   lambda EMPILAIT 20 lectures d'un coup : c'est le schema qui avait vide
#   la file du scan comparatif le 28/08. Desormais une boucle `repeat`
#   envoie un bloc, ATTEND son issue (reponse, exception, non-reponse ou
#   retrait de la file - le hub en garantit exactement une par requete
#   acceptee), puis passe au suivant. Le gestionnaire on_response ne donne
#   que `values`, pas l'adresse : elle est tenue dans scanin_debut, juste
#   parce qu'une seule lecture est en vol. Si aucune issue n'arrive en 15 s,
#   le balayage s'arrete plutot que de risquer d'attribuer une reponse
#   tardive au bloc suivant.
#
#   Blocs de 9 alignes sur des multiples de 9 : jamais a cheval sur un
#   multiple de 45, la limite que le document impose aux lectures.
#
#   Plages : 90-999 et 3000-3299. La seconde est un pari sur l'organisation
#   des SPH/SPA de la meme marque, qui logent la batterie en 3000+.
#
# RESULTAT DU 12/09/2026 a 23:53 - RETIRE de growatt.yaml dans la foulee
#   Aucune donnee BMS. Input 108-210 est un MIROIR des holding 0-102
#   (firmware, serie, reglages, horloge), le reste est vide ou residuel.
#   Compte rendu complet et decodage dans packages/gw-bms-can.yaml.
#   Le fichier reste ici, pret a etre re-inclus pour balayer 83-89,
#   1000-2999 ou au-dela de 3300 - il suffit de changer le calcul de
#   scanin_debut et le count du repeat dans le script ci-dessous.
# =============================================================================

globals:
  - id: scanin_debut
    type: int
    restore_value: no
    initial_value: '-1'

  - id: scanin_attente
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: scanin_arret
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: scanin_echecs
    type: int
    restore_value: no
    initial_value: '0'

script:

  # Blocs : 90 a 999 (102 blocs) puis 3000 a 3297 (34 blocs), pas de 9.
  - id: scan_input
    mode: single
    then:
      - lambda: |-
          id(scanin_echecs) = 0;
          id(scanin_arret) = false;
          ESP_LOGW("scanin", "Debut du balayage input Ond1, 136 blocs de 9");
      - repeat:
          count: 136
          then:
            - if:
                condition:
                  lambda: 'return !id(scanin_arret);'
                then:
                  - lambda: |-
                      id(scanin_debut) = iteration < 102 ? 90 + 9 * (int) iteration
                                                         : 3000 + 9 * ((int) iteration - 102);
                      id(scanin_attente) = true;
                  - modbus_client.read_input_registers:
                      modbus_id: modbus_growatt
                      address: !lambda 'return id(growatt)->device_address();'
                      start_address: !lambda 'return (uint16_t) id(scanin_debut);'
                      count: 9
                      on_response:
                        then:
                          - lambda: |-
                              char buf[200];
                              int n = 0;
                              for (size_t i = 0; i < values.size() && i < 9; i++) {
                                if (values[i] != 0 && n < 170)
                                  n += snprintf(buf + n, sizeof(buf) - n, " I%d=%u",
                                                id(scanin_debut) + (int) i, values[i]);
                              }
                              if (n > 0) ESP_LOGW("scanin", "%s", buf);
                              id(scanin_attente) = false;
                      on_error:
                        then:
                          - lambda: |-
                              ESP_LOGW("scanin", "I%d x9 : exception 0x%02X", id(scanin_debut), (uint8_t) exception_code);
                              id(scanin_attente) = false;
                      on_no_response: !lambda |-
                        ESP_LOGW("scanin", "I%d x9 : pas de reponse", id(scanin_debut));
                        id(scanin_echecs)++;
                        id(scanin_attente) = false;
                        return false;
                      on_not_sent:
                        then:
                          - lambda: |-
                              ESP_LOGW("scanin", "I%d x9 : retiree de la file avant envoi", id(scanin_debut));
                              id(scanin_echecs)++;
                              id(scanin_attente) = false;
                  - wait_until:
                      condition:
                        lambda: 'return !id(scanin_attente);'
                      timeout: 15s
                  - if:
                      condition:
                        lambda: 'return id(scanin_attente);'
                      then:
                        - lambda: |-
                            ESP_LOGW("scanin", "I%d x9 : aucune issue en 15 s, balayage arrete", id(scanin_debut));
                            id(scanin_arret) = true;
      - lambda: |-
          ESP_LOGW("scanin", "Fin du balayage input Ond1 (%s, %d echec(s))",
                   id(scanin_arret) ? "INTERROMPU" : "complet", id(scanin_echecs));

button:
  - platform: template
    name: "${upper_devicename} Scan input Ond1"
    icon: mdi:magnify-scan
    entity_category: diagnostic
    on_press:
      - script.execute: scan_input
