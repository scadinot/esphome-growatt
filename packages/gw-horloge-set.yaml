                           t.year, t.month, t.day_of_month, t.hour, t.minute, t.second, an);
                  return std::vector<uint16_t>{ an,
                                                (uint16_t) t.month,
                                                (uint16_t) t.day_of_month,
                                                (uint16_t) t.hour,
                                                (uint16_t) t.minute,
                                                (uint16_t) t.second };
                on_response:
                  then:
                    - lambda: 'ESP_LOGW("rtc", "Ond2 : mise a l heure acquittee");'
