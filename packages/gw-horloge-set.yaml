                start_address: 45
                values: !lambda |-
                  auto t = id(heure_locale).now();
                  int brut = (int) id(rtc_year_2).state;
                  uint16_t an = (brut > 0 && brut < 100) ? (uint16_t)(t.year % 100)
                                                         : (uint16_t) t.year;
