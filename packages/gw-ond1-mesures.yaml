# =============================================================================
# Onduleur 1 - CAPTEURS. Serie KHM8F3X0XD, adresse Modbus 0x01.
# =============================================================================
# PAQUET inclus par growatt.yaml. Ne se compile pas seul.
#
# ENTITES RETIREES ET POURQUOI (menage du 22/08/2026)
#   - les puissances apparentes (VA) : doublons des puissances actives, la
#     charge de l'onduleur etant deja donnee par Load Percent
#   - Bus Voltage, Output DC Voltage, Battery Port et Bus Voltage (DSP) :
#     tensions internes au convertisseur, non actionnables
#   - Rated Power/VA, Device Type, PV Input Mode, Over Temp Restart, Modbus
#     Address : constantes, reportees dans l'en-tete de growatt.yaml
#   - Max Charge Current (holding 34) : non modifiable en mode LI, sa valeur
#     (400) ne correspond pas au LCD (100 A) et son echelle restait une
#     hypothese - entite trompeuse
#   - Warning Value (input 43) : entier brut de signification incertaine.
#     REMIS le 13/09/2026, en internal : le document Growatt en fait le
#     "warning value", voir l'encadre de gw-ond1-libelles.yaml
#   - Work Time Total (input 30-31) : RETIRE le 13/09/2026, il valait 0,0 h
#     sur les deux onduleurs depuis le 13/08 - registre non implemente sur
#     l'ES Plus, et une trame par cycle pour rien (30-31 formait sa propre
#     plage, 29 et 32 n'etant pas lus)
#
# EN internal: true - actifs mais invisibles dans HA, leur contenu etant
#   restitue par un libelle texte ou un capteur d'alarme de gw-ond1-libelles.
#
# LE PREFIXE [BMS] EST TROMPEUR - constate le 12/09/2026, NOMS CONSERVES
#   [BMS] Battery Voltage (input 17), Discharge Today/Total (60-63),
#   Discharge Power (73), Battery Power (77), Battery Current (calcule) et
#   Over Charge Flag (80) portent des registres de l'ONDULEUR : le document
#   Growatt (docs/) appelle 17 "Bat Volt (M3)", la mesure de son propre
#   microcontroleur, et les autres sont ses compteurs. Seul le SOC (18)
#   vient du BMS, en mode LI. Ce que l'onduleur laisse voir du CAN se
#   limite a trois choses : ce SOC, la limite de courant de charge (H34,
#   dynamique, 0 batterie pleine) et la tension de charge (H35/H36 =
#   57,0 V, la consigne CV du BMS). Le bloc input 90-117 du document est
#   VIDE sur l'ES Plus - balayage du 12/09/2026, compte rendu dans
#   packages/gw-bms-can.yaml.
#   On ne renomme pas - l'historique de ces entites compte, voir NE PLUS
#   RENOMMER dans growatt.yaml. Le prefixe reste, cette note aussi.
#
# SIGNE DES PUISSANCES BATTERIE : chez Growatt, NEGATIF = CHARGE. Verifie le
#   12/09/2026 : -2728 W et -50,4 A pendant une charge reseau a 50,3 A.
#   C'est l'INVERSE de la convention Docan (positif = charge). Les deux
#   familles de courants batterie sont de signe oppose sur un meme tableau
#   de bord - ne pas les additionner sans y penser.
#
# Entites PV commentees : packages/gw-pv-off.yaml.
# Composantes de l'horloge : packages/gw-horloges.yaml.
# =============================================================================

sensor:

  # Restitue par "System Status Text Ond1"
  - platform: modbus_controller
    modbus_controller_id: growatt
    name: "${upper_devicename} System Status Ond1"
    id: system_status
    internal: true
    register_type: read
    address: 0
    value_type: U_WORD
    accuracy_decimals: 0

  # --- INPUT REG 9-16 : sortie AC et charge AC ------------------------------
  - platform: modbus_controller
    modbus_controller_id: growatt
    name: "${upper_devicename} Output Power Ond1"
    id: output_power
    register_type: read
    address: 9
    value_type: U_DWORD
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: growatt
    name: "${upper_devicename} AC Charge Power Ond1"
    id: ac_charge_power
    register_type: read
    address: 13
    value_type: U_DWORD
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    filters:
      - multiply: 0.1

  # --- INPUT REG 17-27 : batterie, reseau, sortie ---------------------------
  - platform: modbus_controller
    modbus_controller_id: growatt
    name: "${upper_devicename} [BMS] Battery Voltage Ond1"
    id: battery_voltage
    register_type: read
    address: 17
    value_type: U_WORD
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 2
    filters:
      - multiply: 0.01

  - platform: modbus_controller
    modbus_controller_id: growatt
    name: "${upper_devicename} [BMS] Battery SOC Ond1"
    id: battery_soc
    register_type: read
    address: 18
    value_type: U_WORD
    unit_of_measurement: "%"
    device_class: battery
    state_class: measurement
    accuracy_decimals: 0

  - platform: modbus_controller
    modbus_controller_id: growatt
    name: "${upper_devicename} Grid Voltage Ond1"
    id: grid_voltage
    register_type: read
    address: 20
    value_type: U_WORD
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: growatt
    name: "${upper_devicename} Grid Frequency Ond1"
    id: grid_frequency
    register_type: read
    address: 21
    value_type: U_WORD
    unit_of_measurement: "Hz"
    device_class: frequency
    state_class: measurement
    accuracy_decimals: 2
    filters:
      - multiply: 0.01

  - platform: modbus_controller
    modbus_controller_id: growatt
    name: "${upper_devicename} Output Voltage Ond1"
    id: output_voltage
    register_type: read
    address: 22
    value_type: U_WORD
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: growatt
    name: "${upper_devicename} Output Frequency Ond1"
    id: output_frequency
    register_type: read
    address: 23
    value_type: U_WORD
    unit_of_measurement: "Hz"
    device_class: frequency
    state_class: measurement
    accuracy_decimals: 2
    filters:
      - multiply: 0.01

  - platform: modbus_controller
    modbus_controller_id: growatt
    name: "${upper_devicename} Inverter Temperature Ond1"
    id: inverter_temp
    register_type: read
    address: 25
    value_type: U_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: growatt
    name: "${upper_devicename} DC-DC Temperature Ond1"
    id: dcdc_temp
    register_type: read
    address: 26
    value_type: U_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: growatt
    name: "${upper_devicename} Load Percent Ond1"
    id: load_percent
    register_type: read
    address: 27
    value_type: U_WORD
    unit_of_measurement: "%"
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  # --- INPUT REG 34-43 : courants, defauts ----------------------------------
  - platform: modbus_controller
    modbus_controller_id: growatt
    name: "${upper_devicename} Output Current Ond1"
    id: output_current
    register_type: read
    address: 34
    value_type: U_WORD
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: growatt
    name: "${upper_devicename} Inverter Current Ond1"
    id: inverter_current
    register_type: read
    address: 35
    value_type: U_WORD
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: growatt
    name: "${upper_devicename} AC Input Power Ond1"
    id: ac_input_power
    register_type: read
    address: 36
    value_type: U_DWORD
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    filters:
      - multiply: 0.1

  # Input 40 a 43 : restitues par "Fault Text", "Warning Text", "Fault
  # Active", "Warning Active" et les capteurs [BMS] de gw-ond1-libelles.
  # Document Growatt : 40 fault bit, 41 warning bit, 42 fault value,
  # 43 warning value. Configuration d'origine : 40 et 41 numeros LCD, 42
  # masque BMS. Les deux lectures sont tentees, voir gw-ond1-libelles.
  - platform: modbus_controller
    modbus_controller_id: growatt
    name: "${upper_devicename} Fault Code Ond1"
    id: fault_code
    internal: true
    register_type: read
    address: 40
    value_type: U_WORD
    accuracy_decimals: 0

  - platform: modbus_controller
    modbus_controller_id: growatt
    name: "${upper_devicename} Warning Code Ond1"
    id: warning_code
    internal: true
    register_type: read
    address: 41
    value_type: U_WORD
    accuracy_decimals: 0

  # Alimente les cinq capteurs [BMS] (bits) et le libelle de defaut (numero).
  - platform: modbus_controller
    modbus_controller_id: growatt
    name: "${upper_devicename} BMS Warning Bitmask High Ond1"
    id: warning_code_high
    internal: true
    register_type: read
    address: 42
    value_type: U_WORD
    accuracy_decimals: 0

  - platform: modbus_controller
    modbus_controller_id: growatt
    name: "${upper_devicename} Warning Value Ond1"
    id: warning_value
    internal: true
    register_type: read
    address: 43
    value_type: U_WORD
    accuracy_decimals: 0

  # --- INPUT REG 56-67 : energies reseau et batterie ------------------------
  - platform: modbus_controller
    modbus_controller_id: growatt
    name: "${upper_devicename} AC Charge Energy Today Ond1"
    id: ac_charge_energy_today
    register_type: read
    address: 56
    value_type: U_DWORD
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: growatt
    name: "${upper_devicename} AC Charge Energy Total Ond1"
    id: ac_charge_energy_total
    register_type: read
    address: 58
    value_type: U_DWORD
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: growatt
    name: "${upper_devicename} [BMS] Battery Discharge Today Ond1"
    id: battery_discharge_today
    register_type: read
    address: 60
    value_type: U_DWORD
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: growatt
    name: "${upper_devicename} [BMS] Battery Discharge Total Ond1"
    id: battery_discharge_total
    register_type: read
    address: 62
    value_type: U_DWORD
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: growatt
    name: "${upper_devicename} AC Output Energy Today Ond1"
    id: ac_output_energy_today
    register_type: read
    address: 64
    value_type: U_DWORD
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: growatt
    name: "${upper_devicename} AC Output Energy Total Ond1"
    id: ac_output_energy_total
    register_type: read
    address: 66
    value_type: U_DWORD
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  # --- INPUT REG 68-82 : courants, puissances, ventilation ------------------
  - platform: modbus_controller
    modbus_controller_id: growatt
    name: "${upper_devicename} AC Charge Current Ond1"
    id: ac_charge_current
    register_type: read
    address: 68
    value_type: U_WORD
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  # S_DWORD et non U_DWORD : ce registre passe en negatif (observe a -1, lu
  # comme 4294967295 en non signe, soit un pic parasite de 4,29e8 W dans HA).
  - platform: modbus_controller
    modbus_controller_id: growatt
    name: "${upper_devicename} AC Discharge Power Ond1"
    id: ac_discharge_power
    register_type: read
    address: 69
    value_type: S_DWORD
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: growatt
    name: "${upper_devicename} [BMS] Battery Discharge Power Ond1"
    id: battery_discharge_power
    register_type: read
    address: 73
    value_type: U_DWORD
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: growatt
    name: "${upper_devicename} [BMS] Battery Power Ond1"
    id: battery_power
    register_type: read
    address: 77
    value_type: S_DWORD
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    filters:
      - multiply: 0.1

  # Restitue par "[BMS] Battery Over Charged Ond1"
  - platform: modbus_controller
    modbus_controller_id: growatt
    name: "${upper_devicename} [BMS] Battery Over Charge Flag Ond1"
    id: battery_over_charge
    internal: true
    register_type: read
    address: 80
    value_type: U_WORD
    accuracy_decimals: 0

  - platform: modbus_controller
    modbus_controller_id: growatt
    name: "${upper_devicename} Inverter Fan Speed Ond1"
    id: inverter_fan_speed
    register_type: read
    address: 82
    value_type: U_WORD
    unit_of_measurement: "%"
    state_class: measurement
    accuracy_decimals: 0

  # Courant batterie deduit : puissance / tension. Herite du signe de
  # l'input 77 : NEGATIF = charge, cf. en-tete.
  - platform: template
    name: "${upper_devicename} [BMS] Battery Current Ond1"
    id: battery_current
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    accuracy_decimals: 1
    lambda: |-
      if (isnan(id(battery_power).state) || isnan(id(battery_voltage).state)) return NAN;
      if (id(battery_voltage).state == 0) return NAN;
      return id(battery_power).state / id(battery_voltage).state;
    update_interval: 30s
