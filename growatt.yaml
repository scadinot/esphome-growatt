# =============================================================================
# ESPHome - Growatt SPF 6000 ES Plus x2 - Waveshare ESP32-S3-ETH
# FICHIER D'ENTREE. Tout le contenu est dans les paquets inclus plus bas.
# =============================================================================
# POURQUOI CE DECOUPAGE (23/08/2026)
#   L'ancien growatt-s3.yaml monolithique avait atteint 86 000 caracteres et
#   n'etait plus reecrivable d'un bloc par l'outillage. Chaque paquet reste
#   court : une retouche sur l'onduleur 2 ne touche que son propre fichier.
#   Les paquets sont dans packages/ pour ne pas apparaitre comme de faux
#   appareils dans le tableau de bord ESPHome - il ne scrute que la racine.
#
# OU TROUVER QUOI :
#   packages/gw-ond1-mesures.yaml .. capteurs Ond1 + entites retirees
#   packages/gw-ond1-libelles.yaml . libelles texte et alarmes Ond1
#   packages/gw-ond1-reglages.yaml . switch/select/number, synchro AC1,
#                                    fenetres horaires
#   packages/gw-ond1-divers.yaml ... releves de config en lecture seule
#   packages/gw-seuils-soc.yaml .... Prog 12, 13 et 21 - le cycle batterie
#   packages/gw-ond2.yaml .......... tout l'onduleur 2
#   packages/gw-horloges.yaml ...... les deux RTC et leur ecart
#   packages/gw-horloge-set.yaml ... mise a l'heure depuis l'ESP
#   packages/gw-pv-off.yaml ........ PV et generateur, commentes en attente
#   packages/gw-firmware.yaml ...... versions firmware des deux onduleurs
#   packages/gw-comparaison.yaml ... reglages compares Ond1 / Ond2
#   packages/gw-comparaison-b.yaml . complement : H39 H8 H94 H20 H3-H6 H22
#   packages/gw-scan-diff.yaml ..... balayage H0-H99 et diff des deux
# =============================================================================
# LES DEUX ONDULEURS
#   Adresse Modbus 1 (Prog 28) ... serie KHM8F3X0XD
#   Adresse Modbus 2 (Prog 28) ... serie UYN8G3V04A
#   Numeros DISTINCTS : deux unites physiques, pas un echo.
#
# CONVENTION DE NOMMAGE
#   Suffixe "Ond1" ou "Ond2" sur toute entite rattachee a un onduleur, pour
#   que les deux versions d'une meme mesure se retrouvent cote a cote dans les
#   listes triees. Non suffixees : les entites propres a l'ESP.
#   Les reglages supposes SE PROPAGER portent "Ond1" - c'est la que l'ecriture
#   part. L'absence de jumeau "Ond2" traduit la realite.
#
#   NE PLUS RENOMMER. Home Assistant derive l'identifiant d'une entite de son
#   nom : un renommage cree de nouvelles entites et orpheline les anciennes,
#   l'historique est perdu. Les renommages du 23/08/2026 ont ete faits tant
#   que l'historique ne valait rien. Ce n'est plus le cas.
#
# CARTOGRAPHIE DES HOLDING REGISTERS, etablie par aller-retour LCD
#   ATTENTION : cette carte ne contient que ce que quelqu'un a pense a
#   toucher sur l'ecran. Elle n'est PAS garantie exhaustive. Le balayage
#   integral (gw-scan-diff.yaml) devait lever ce doute : il lit 100/100
#   registres cote Ond1 et ZERO cote Ond2, en blocs de 20 comme de 10, alors
#   qu'Ond2 repond parfaitement aux lectures ciblees. Cause inconnue.
#   La comparaison passe donc par des entites declarees, paquets
#   gw-comparaison.yaml et gw-comparaison-b.yaml, qui couvrent toute la
#   carte ci-dessous - mais rien de ce qu'elle ignore.
#
#   H1 Output Priority | H2 Charge Priority | H3-H6 fenetres horaires
#   H8 AC Input Mode | H18 Output Voltage | H19 Output Freq | H20 Overload
#   H22 Buzzer | H23-H27 numero de serie ASCII
#   H34 Max Charge Current - DYNAMIQUE en mode LI, impose par le BMS.
#       A affiche 100, 280, 400 cote Ond1 selon les jours, 55 cote Ond2 qui
#       n'a pas de lien BMS complet. Ce n'est PAS une consigne : un ecart
#       ici ne veut rien dire, ne pas le signaler au SAV.
#   H35 Bulk Charge V | H36 Float Charge V (x10)
#   H37 Prog 12 SOC vers reseau (x10)
#   H38 Prog 11 AC1 courant de charge reseau (1 A)
#   H39 Battery Type | H45-H50 horloge
#   H76-H79 puissance et VA nominales (x10, = 60000 pour 6000 W)
#   H82 Prog 21 SOC de coupure basse (x10)
#   H83 Prog 11 GEN1 courant de charge groupe (1 A)
#   H94 seuil de coupure basse en VOLTS (x10) - le pendant du Prog 21
#   H95 Prog 13 SOC de retour batterie (x10)
#
#   AJOUT du 27/08/2026 : H9-H11 firmware principal, H12-H14 firmware DSP,
#   ASCII 6 caracteres. Adresses tirees du document Growatt, confirmees par
#   la lecture - elles rendent des chaines propres du premier coup.
#
#   H18 EST UNE ENUMERATION, pas une tension : il vaut 1 sur les DEUX
#   onduleurs (1 = 230 V). L'ecart de 2.1 V entre les sorties ne vient donc
#   PAS d'un reglage. Verifie le 28/08/2026.
# =============================================================================
# MATERIEL : Waveshare ESP32-S3-ETH + PoE Module (B)
# -----------------------------------------------------------------------------
# W5500 Ethernet cable en interne - RIEN A CABLER, ne pas utiliser ces GPIO :
#   SCLK GPIO13 | MOSI GPIO11 | MISO GPIO12 | CS GPIO14 | INT GPIO10 | RST GPIO9
#
# ORDRE REEL DES TROUS, rangee basse, releve sur la serigraphie :
#   3V3 | IO21 | IO17 | GND | IO16 | IO18 | RUN | IO15 | GND
#   ATTENTION : il y a bien IO16 ENTRE le GND et IO18.
#
# A NE PAS UTILISER
#   IO19 / IO20 ... USB natif, indispensable pour flasher
#   IO43 / IO44 ... console UART0
#   IO0 / IO45 / IO46 ... strapping au demarrage
#   IO3 ... strapping JTAG
#   IO33 a IO37 ... consommes par la PSRAM en version octale (reference R8)
#
# CABLAGE RS485 - VALIDE le 22/08/2026 (Waveshare TTL TO RS485 isole)
#   Le croisement est normal : le TXD du module EMET, il arrive donc sur la
#   broche de RECEPTION de l'ESP.
#
#     Module RS485          Fil      ESP32-S3
#     VCC (3.3V/5V)  --->   vert     3V3
#     TXD            --->   bleu     IO16    (rx_pin)
#     RXD            --->   violet   IO17    (tx_pin)
#     GND            --->   blanc    GND
#
#     Module RS485          Onduleur Port 17 (RJ45)
#     A+             --->   Pin 2 (Orange)       = RS485A
#     B-             --->   Pin 1 (Blanc/Orange) = RS485B
#
# PAS DE status_led : pas de LED simple sur GPIO2 mais une RGB adressable.
# RESERVE POUR L'ECRAN : IO15, IO18, IO21 et la rangee haute. L'ecran aura son
#   PROPRE bus SPI - celui du W5500 ne sort pas sur les connecteurs.
#
# UN SEUL MAITRE SUR LE BUS : le 23/08/2026 l'ancien D1 Mini est reste allume
#   une journee en parallele du S3, emettant vers l'adresse 1 sans jamais
#   obtenir de reponse. Deux maitres Modbus ne cohabitent pas sur une paire.
# =============================================================================
# DEUX PIEGES A CONNAITRE
# -----------------------------------------------------------------------------
# 1. skip_updates est une propriete de la PLAGE Modbus, PAS de l'entite.
#    ESPHome regroupe les registres voisins en une commande, et un item
#    porteur de skip_updates affame alors TOUS ceux de sa plage. Vecu le
#    22/08 : les text_sensors ASCII en skip_updates: 60 gelaient les selects
#    et numbers voisins - l'ecriture partait, le LCD suivait, mais l'entite
#    retombait sur une valeur perimee.
#    CORRECTIF : force_new_range: true sur tout item porteur de skip_updates.
#
# 2. "Duplicate modbus command found" ne signale PAS un doublon d'entite :
#    ESPHome trouve une commande identique deja en file et ne l'ajoute pas
#    deux fois. Rien n'est perdu. Le critere est QUAND il sort :
#      en continu pendant la scrutation => SATURATION, allonger l'intervalle
#      une ligne isolee apres une ecriture, count=1 => normal, c'est la
#        relecture de controle qui suit toute ecriture
#
# BUDGET DE SCRUTATION mesure le 22/08/2026 : 17 s par tour sous une charge
#   plus agressive que la realite. A 30 s d'intervalle la marge est
#   confortable, et la mise en veille du PV l'a elargie. A resurveiller le
#   jour ou le PV sera reactive.
# =============================================================================
# INSTALLATION (aout 2026)
#   13/08 : batteries seules - ni reseau ni PV.
#   22/08 : reseau raccorde, batterie en charge.
#   23/08 : charge complete - 100 % SOC, 53,99 V au repos, 3,374 V/cellule.
#           BMS : 324,23 / 325,87 Ah, cellules a 3,360 et 3,361 V. Horloges
#           des deux onduleurs recalees.
#   24/08 : Prog 13 et 21 cartographies par balayage. PV et generateur
#           toujours absents.
#   26/08 : reseau perdu a 21h23. Les deux onduleurs passent en decharge.
#           Sorties en parallele, aucune consommation : Ond1 regule 1 V plus
#           haut et pousse une centaine de watts dans Ond2, qui les dissipe.
#           138 W tires de la batterie pour rien.
#   27/08 : firmwares lus - ILS DIFFERENT. Ond1 100.06/101.05, Ond2
#           100.08/101.07. Sorties decouplees le soir : la circulation cesse,
#           Ond2 refroidit de 2.8 C a 0.5 C d'ecart. Gain reel 10 W seulement,
#           le reste des 138 W etant l'autoconsommation des deux machines
#           (~64 W chacune). Decouples, l'ecart de consigne monte a 2.1 V.
#   28/08 : audit des reglages. 11 concordent sur 13, dont H18 - la piste
#           "c'est un reglage" est morte, reste le firmware DSP.
#           Ajout de gw-comparaison.yaml, gw-comparaison-b.yaml et
#           gw-scan-diff.yaml. Absorption et floating tous deux a 57,0 V sur
#           les deux machines : a verifier a la prochaine charge complete,
#           c'est exactement le seuil de protection haute des BMS.
#
# FENETRE DE CHARGE RESEAU : laissee OUVERTE 0h-23h pour atteindre les 100 %.
#   A REFERMER sur les heures creuses. Une fenetre fermee arrete l'apport
#   reseau SANS aucune alarme - le statut affiche simplement "Bypass".
# =============================================================================

substitutions:
  device_name: "growatt"
  upper_devicename: "Growatt"
  ap_ssid: "Growatt-Setup"

packages:
  ond1_mesures:  !include packages/gw-ond1-mesures.yaml
  ond1_libelles: !include packages/gw-ond1-libelles.yaml
  ond1_reglages: !include packages/gw-ond1-reglages.yaml
  ond1_divers:   !include packages/gw-ond1-divers.yaml
  seuils_soc:    !include packages/gw-seuils-soc.yaml
  ond2:          !include packages/gw-ond2.yaml
  horloges:      !include packages/gw-horloges.yaml
  horloge_set:   !include packages/gw-horloge-set.yaml
  pv_off:        !include packages/gw-pv-off.yaml
  firmware:      !include packages/gw-firmware.yaml
  comparaison:   !include packages/gw-comparaison.yaml
  comparaison_b: !include packages/gw-comparaison-b.yaml
  scan_diff:     !include packages/gw-scan-diff.yaml

esphome:
  name: ${device_name}
  friendly_name: ${upper_devicename}

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: ${ap_ssid}
    password: !secret wifi_password

captive_portal:

web_server:
  version: 3
  port: 80

# id indispensable : les boutons de gw-horloge-set.yaml y puisent l'heure.
time:
  - platform: sntp
    id: heure_locale
    timezone: Europe/Paris

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_pass

logger:
  level: WARN
  hardware_uart: USB_SERIAL_JTAG

# =============================================================================
# ETAPE FINALE - ETHERNET (a n'activer qu'en TOUT DERNIER)
# ESPHome n'accepte PAS wifi: et ethernet: simultanement. Supprimer le bloc
# wifi ci-dessus, decommenter celui-ci, flasher une derniere fois par le WiFi.
# Si le lien ne monte pas, retour oblige a l'USB.
#
# ethernet:
#   type: W5500
#   clk_pin: GPIO13
#   mosi_pin: GPIO11
#   miso_pin: GPIO12
#   cs_pin: GPIO14
#   interrupt_pin: GPIO10
#   reset_pin: GPIO9
# =============================================================================

uart:
  id: uart_growatt
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 9600
  data_bits: 8
  parity: NONE
  stop_bits: 1

modbus:
  id: modbus_growatt
  uart_id: uart_growatt
  send_wait_time: 200ms

modbus_controller:
  - id: growatt
    address: 0x01
    modbus_id: modbus_growatt
    setup_priority: -10
    update_interval: 30s
    command_throttle: 100ms   # standard Modbus RTU

  - id: growatt2
    address: 0x02
    modbus_id: modbus_growatt
    setup_priority: -10
    update_interval: 30s
    command_throttle: 100ms

sensor:
  - platform: wifi_signal
    name: "${upper_devicename} WiFi Signal"
    update_interval: 60s
    entity_category: diagnostic

  - platform: uptime
    name: "${upper_devicename} Uptime"
    unit_of_measurement: "h"
    accuracy_decimals: 2
    entity_category: diagnostic
    filters:
      - lambda: return x / 3600.0;

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "${upper_devicename} IP Address"
      entity_category: diagnostic

button:
  - platform: restart
    name: "${upper_devicename} Restart ESP"
    entity_category: config
